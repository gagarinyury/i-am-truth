# Эталонный разбор — Cheng et al. 2024
#
# Отличие от McDonald принципиальное: этот эталон **не наш**. Он выписан из
# опубликованного письма в редакцию того же журнала — независимой экспертной критики,
# прошедшей редакционный контроль и получившей ответ авторов статьи.
#
#   Критика: Fei Lu, «Time-Related Biases in Observational Studies of GLP-1 Agonists
#            and Cancer Risk», Journal of Diabetes, DOI 10.1111/1753-0407.70202,
#            PMC12967869
#   Ответ авторов: DOI 10.1111/1753-0407.70203, PMC12967868
#
# Зачем он нужен: калибровка проекта стояла на одном кейсе, и притом на кейсе,
# разобранном самим автором проекта (Q-01). Возражение «эталон и система сделаны одной
# головой» снимается только внешним источником. Здесь пункты не сочинены нами — они
# процитированы из письма; наша роль сведена к переносу без интерпретации.
#
# Правило: числа не редактировать по памяти. Всё в этом файле взято дословно из письма
# или из абстракта самой статьи, снято 2026-08-28.

case_id: cheng-2024
title: "The potential adverse effects of hypodermic glucagon-like peptide-1 receptor agonist on patients with type 2 diabetes: A population-based study"
journal: "Journal of Diabetes, 2024; 16(10):e70013"
doi: "10.1111/1753-0407.70013"
pmcid: "PMC11494487"
strength: external      # эталон из внешней опубликованной критики, не наш разбор
version: 1
expert_points_total: 4

source_of_truth:
  letter_doi: "10.1111/1753-0407.70202"
  letter_pmcid: "PMC12967869"
  letter_author: "Fei Lu"
  reply_doi: "10.1111/1753-0407.70203"
  note: >
    Все четыре пункта ниже — методологические претензии, прямо сформулированные в
    письме. Пятое замечание письма (сравнение с работами Pasternak et al. и Wolff Sagy
    et al., где применён active-comparator new-user дизайн с lag-периодами) в эталон не
    вошло: это рекомендация к будущим исследованиям, а не дефект разобранной работы.

expert_points:
  - id: C1
    short: "Predominant-user дизайн вместо new-user; нет pre-baseline washout"
    full: >
      Пациенты классифицированы по преобладающей терапии от базовой точки до конца
      наблюдения (группы GLP-1RA, только инсулин, только метформин, с допуском
      использования других сахароснижающих ≤ 6 месяцев). Это predominant-user дизайн, а
      не инициация терапии на входе в когорту. Отсутствие pre-baseline washout не
      гарантирует, что пациенты не получали препараты до базовой точки, — отсюда
      prevalent user bias: в выборку избирательно попадают уже удержавшиеся на терапии.
      Цитата письма: «the absence of a pre-baseline washout period to identify incident
      users may introduce prevalent user bias».
    key_numbers: ["6"]
    requires_appendix: false

  - id: C2
    short: "Нет lag-периода — detection bias вместо эффекта препарата"
    full: >
      Начало терапии GLP-1RA сопровождается усиленным клиническим наблюдением и ростом
      обращаемости, что повышает вероятность обнаружить бессимптомную или индолентную
      опухоль. Без исключения раннего периода наблюдения ассоциации, особенно в первый
      год, могут отражать выявление, а не причинный эффект. Цитата письма: «observed
      associations, especially those occurring within the first year of treatment, may
      therefore reflect detection bias rather than a causal drug effect».
    key_numbers: []
    requires_appendix: false

  - id: C3
    short: "Градиент по длительности обратный причинному: риск в <12 мес, но не в ≥12 мес"
    full: >
      Собственная стратификация авторов по накопленной длительности приёма
      (< 12 месяцев против ≥ 12 месяцев) показывает повышенный риск преимущественно при
      КОРОТКОЙ экспозиции, тогда как при длительном приёме ассоциация не подтверждается.
      Для канцерогенного эффекта ожидался бы обратный градиент — риск растёт с
      экспозицией. Наблюдаемая картина характерна для выявления, а не для эффекта.
    key_numbers: ["12"]
    requires_appendix: false

  - id: C4
    short: "Наблюдение ~24 месяца — короче латентности рака"
    full: >
      Среднее время наблюдения около 24 месяцев и сопоставимо между группами. Для
      онкологических исходов этого недостаточно: латентность опухоли превышает срок
      наблюдения, поэтому связать зарегистрированные случаи с началом терапии
      причинно нельзя.
    key_numbers: ["24"]
    requires_appendix: false

traps:
  - id: T1
    description: >
      Ловушка направления. Здесь дизайн-дефекты работают на ПОВЫШЕНИЕ наблюдаемого
      риска (detection bias), а не на понижение, как в кейсе McDonald. Разбор, который
      по инерции объявит смещение «в сторону защитного эффекта», ошибается направлением.
    expected: "away_from_null в сторону завышения вреда"
