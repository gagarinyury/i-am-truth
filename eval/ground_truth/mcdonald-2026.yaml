# Эталонный разбор — McDonald et al. 2026
# Источник: ~/code/my-research/01-glp1-asco2026-research/studies/01-mcdonald-breast-cancer.md
# Все числа там сверены с полным PDF статьи (Tables 1-5, Appendix Tables 1-2) 2026-06-12.
# Правило: числа в этом файле НЕ редактировать по памяти — только копированием из
# первоисточника.

case_id: mcdonald-2026
title: "GLP-1 Agonists Are Associated With a Significant Reduction in Breast Cancer Incidence in Women"
journal: "JCO Oncology Practice, 2026; 22(7):1341-1348"
doi: "10.1200/OP-26-00485"
pmid: "42227662"
strength: full          # full | weak — у этого кейса развёрнутый экспертный разбор
version: 2              # v2 (27.08.2026): добавлен P6 — см. F-32
expert_points_total: 6

# Внешние артефакты, построенные на этом разборе
artifacts:
  pubpeer: "https://pubpeer.com/publications/D57FF2ADC118A404A93FD59B1A501E#1"
  qba: "E-value 2.21 (точка) / 1.73 (граница CI); предел prior-BC канала 0.925"

expert_points:
  - id: P1
    short: "История рака груди: не исключена, не в матчинге, дисбалансирована"
    full: >
      Прошлый рак груди — сильнейший предиктор нового — не исключён (нет washout) и не
      входит в переменные матчинга. Направление дисбаланса: КОНТРОЛЬ обогащён, а не
      группа GLP-1. Полная когорта: контроль 9.2% (8 876) против GLP-1 5.9% (907).
      Matched-когорта: контроль 7.8% против GLP-1 5.9% — то есть матчинг дисбаланс не
      убрал. Это примерно 290 «лишних» высокорисковых женщин в контроле
      (1.9 п.п. × 15 264) против разницы всего в 106 раков — один этот дисбаланс
      способен объяснить весь наблюдаемый «защитный» эффект.
    key_numbers: ["9.2", "5.9", "7.8", "290", "106", "8876", "907"]
    requires_appendix: true
    direction: "контроль выше, GLP-1 ниже"
    trap: "приписать 7.8%/9.2% группе GLP-1 (инверсия направления — обнуляет вывод)"

  - id: P2
    short: "Sicker-yet-fewer-cancers: направление confounding by indication обратное"
    full: >
      Группа GLP-1 БОЛЬНЕЕ по коморбидности: Charlson >=5 19.7% vs 10.4%; сердечная
      13.0 vs 7.3; почечная 13.9 vs 7.1. Больше коморбидности = больше медицинских
      контактов = больше шансов выявления. Раков при этом меньше — то есть эффект идёт
      ПРОТИВ градиента, что указывает на остаточный отбор, а не на защиту.
      Типичная ошибка модели без appendix — предположить обратное («healthy user effect»).
    key_numbers: ["19.7", "10.4", "13.0", "7.3", "13.9", "7.1"]
    requires_appendix: true
    trap: "healthy user effect"   # неверный по направлению ответ, который надо ловить

  - id: P3
    short: "Prevalent-user дизайн без person-time: immortal time / reverse causation"
    full: >
      Фактически cross-sectional / prevalent-user: экспозиция = «любое prior/current
      использование», оценка логистической регрессией (OR) без time-to-event, без
      washout, без минимальной длительности терапии и без дозы. Авторы прямо пишут
      «did not require a minimum duration of therapy».
    key_numbers: []
    requires_appendix: false

  - id: P4
    short: "Компаратор — отобранные диабетики; матчинг по максимальному BMI, не по траектории"
    full: >
      Матчинг по диабету 2 типа сделал контрольную группу нетипичной: диабет 53.4% в
      matched-контроле против 17.6% в источнике. Матчинг по МАКСИМАЛЬНОМУ BMI фиксирует
      вес «до похудения», а не траекторию веса, поэтому эффект молекулы неотделим от
      самого похудения (для сравнения: бариатрия даёт RR 0.56).
    key_numbers: ["53.4", "17.6", "0.56"]
    requires_appendix: false   # Table 2 и раздел методов — основной текст, не приложение

  - id: P5
    short: "Относительное vs абсолютное: ARR 0.69 п.п., NNT ~145"
    full: >
      Заголовок «significant reduction» опирается на относительную величину. Абсолютное
      снижение: 2.31% -> 1.62% = 0.69 процентных пункта (CI 0.38-1.01), NNT примерно 145,
      причём в уже отснятой (скринируемой) популяции. Собственный вывод авторов —
      «largely hypothesis generating».
    key_numbers: ["2.31", "1.62", "0.69", "145"]
    requires_appendix: false

  - id: P6
    short: "Detection / surveillance bias по скринингу: авторы его подняли, но не устранили"
    full: >
      Почти все раки выявлены скринингом: true-positive 241 из 247 в группе GLP-1 и
      2 295 из 2 381 в контроле (Table 1). Значит «заболеваемость» напрямую зависит от
      интенсивности маммографии. При этом частота и регулярность скрининга НЕ входят в
      переменные матчинга. Авторы сами пишут в Introduction, что у пользователей GLP-1
      выше частота скрининга и это «potentially confounding the results», но в
      Limitations разбирают только обратный сценарий (покупка препарата вне системы),
      а прямой surveillance bias не устраняют. Дополнительно: вся когорта — женщины,
      прошедшие маммографию, то есть условие на скрининг создаёт коллайдер.
    key_numbers: ["241", "247", "2295", "2381"]
    requires_appendix: false
    direction: "может создавать видимость защиты, если экспонированные скринируются чаще"

# Что НЕ должно засчитываться как попадание
classification_notes: >
  Это не фабрикация (числа внутренне согласованы, авторы честны в limitations) и не
  статистический шум (события в тысячах, CI узкие). Это реальная ассоциация, объяснимая
  отбором, поданная как причинность. Ответ «данные сфабрикованы» или «это случайность» —
  ошибка, а не находка.
