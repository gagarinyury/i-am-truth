# Прогон тестов на каждый push и pull request.
#
# Почему это вообще заведено. Пятнадцать тестов существовали и запускались
# вручную по одному, а README называл два из них. Тест, который никто не
# запускает, — это не проверка, а комментарий с кавычками; проект, который
# требует от чужих статей воспроизводимости, начинает с себя.
#
# Модель здесь не вызывается ни разу — ни один тест не стоит вызова Vertex, и
# замеры продукта (`eval/`) в CI не идут намеренно.
#
# А вот сеть используется, и утверждать обратное было бы неправдой: два файла
# обращаются к Europe PMC (`test_parallel_isolation`, `test_appendix_pdf`). Оба
# переживают отказ источника пропуском с объяснением, а не провалом: 29.08 Europe
# PMC двадцать минут отдавал 503 всем подряд, и красный CI от чужой аварии — это
# ложное обвинение собственному коду.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"    # та же версия, что в Dockerfile
      - name: install
        # Ставится то же, что в образ, — версии зафиксированы по проверенному
        # окружению, и расходиться CI с продом здесь не должен.
        run: pip install --no-cache-dir -r requirements.txt
      - name: tests
        run: python3 tests/run_all.py
      - name: self-test of the stats functions
        # `stats_tool` сверяется с опубликованными значениями VanderWeele & Ding
        # при прямом запуске; это отдельная проверка, и её тоже надо гонять.
        run: python3 -m truth.stats_tool
